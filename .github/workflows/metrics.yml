name: Metrics

# Секрет METRICS_TOKEN — classic PAT с правом read:user
# (и repo, если хочешь учитывать коммиты в приватных репозиториях).
# Settings → Secrets and variables → Actions → New repository secret.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Yekaterinburg
          config_animations: no
          output_action: commit
          committer_message: "chore: update isometric commit calendar"
