name: Metrics

# Секрет METRICS_TOKEN — classic PAT с правом read:user
# (и repo, если хочешь учитывать коммиты в приватных репозиториях).
# Settings → Secrets and variables → Actions → New repository secret.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate isometric calendar
        run: |
          docker run --rm \
            -v "$PWD:/renders" \
            -e INPUT_TOKEN="${{ secrets.METRICS_TOKEN }}" \
            -e INPUT_FILENAME=metrics.isocalendar.svg \
            -e INPUT_BASE= \
            -e INPUT_PLUGIN_ISOCALENDAR=yes \
            -e INPUT_PLUGIN_ISOCALENDAR_DURATION=half-year \
            -e INPUT_CONFIG_TIMEZONE=Asia/Yekaterinburg \
            -e INPUT_CONFIG_ANIMATIONS=no \
            ghcr.io/lowlighter/metrics:latest

      - name: Remove «Contributions calendar» header
        run: |
          sudo chown "$(id -u):$(id -g)" metrics.isocalendar.svg
          python3 .github/scripts/trim-isocalendar.py metrics.isocalendar.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.isocalendar.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update isometric commit calendar"
            git push
          fi
